# Local development database. `make up` starts it; `make reset` wipes it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onexn_owner # superuser here; owns the schema
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: onexn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onexn_owner -d onexn"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
